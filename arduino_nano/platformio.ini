; Optional: build/flash with PlatformIO instead of the Arduino IDE.
;   pio run                        build
;   pio run -t upload              flash a Nano with the old bootloader (most clones, 57600 baud)
;   pio run -e nano_new -t upload  flash a Nano with the new bootloader (115200 baud)
; Stop the ROS 2 nodes first: they hold the serial port.
[platformio]
src_dir = .
default_envs = nano

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

[env:nano_new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
